name: CI/CD - Build, Push, Update GitOps Manifest

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: app
        run: mvn -B clean package

      - name: Compute image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/argocd-deployment:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/argocd-deployment:latest

      - name: Commit and push updated manifest
        env:
          NEW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/argocd-deployment:${{ steps.vars.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main may have moved since this job's own commit triggered it
          # (another push landed first) - always edit against the latest
          # tip instead of this job's now-stale checkout, and retry the
          # push a few times in case of a continued race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i "s|image: .*/argocd-deployment:.*|image: ${NEW_IMAGE}|" gitops/deployment.yaml
            git add gitops/deployment.yaml
            if git diff --cached --quiet; then
              echo "No manifest changes"
              exit 0
            fi
            git commit -m "ci: deploy image ${{ steps.vars.outputs.tag }}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), retrying against latest main..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries" >&2
          exit 1
