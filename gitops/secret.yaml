# NOTE (demo only): committing plaintext Secret manifests to Git is not a
# production-safe GitOps pattern. Real setups encrypt secrets at rest in Git
# using tools like Sealed Secrets, SOPS, or External Secrets Operator. This
# repo keeps it in plain stringData purely to demonstrate the Secret ->
# Deployment wiring end to end.
apiVersion: v1
kind: Secret
metadata:
  name: gitops-demo-secret
  namespace: gitops-demo
type: Opaque
stringData:
  DEMO_USERNAME: "admin"
  DEMO_PASSWORD: "admin123"
