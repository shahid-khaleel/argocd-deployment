<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitOps Demo - Login</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="version-badge" id="version-badge">v-.-.-</div>
<div class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>
  <h1>GitOps Demo</h1>
  <p class="subtitle" id="subtitle">Sign in to continue</p>

  <form id="login-form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />

    <button type="submit">Log in</button>
  </form>

  <div id="message" class="message hidden"></div>

  <div id="dashboard" class="dashboard hidden">
    <h2 id="dashboard-welcome"></h2>
    <p>Signed in as <strong id="dashboard-user"></strong></p>
    <p class="meta">App version: <span id="app-version">-</span></p>
    <p class="meta">Served by pod: <span id="app-host">-</span></p>
    <button id="logout-btn">Log out</button>
  </div>

  <p class="hint">Demo credentials are seeded from a Kubernetes Secret (default: admin / admin123).</p>
</div>
<script src="js/app.js"></script>
</body>
</html>
